name: Monitor

# External monitor of production (ADR 0019, docs/runbooks/MONITORING.md). When a run fails, GitHub
# e-mails the person who last changed this schedule: that e-mail is the alert. No other service
# is involved, and nothing here can change production: every request is a read.
#
# GitHub disables scheduled workflows after 60 days without activity in the repository and may
# delay or skip a run under load: this is a safety net, not a guarantee.

on:
  schedule:
    # Hourly: what is broken now.
    - cron: "17 * * * *"
    # Once a day (09:43 in Brasília): also work that has been waiting for a person.
    - cron: "43 12 * * *"
  workflow_dispatch:
    inputs:
      attention:
        description: "Also fail for work waiting for a person"
        type: boolean
        default: true

permissions: {}

concurrency:
  group: monitor
  cancel-in-progress: false

env:
  BASE_URL: https://linkfav.com
  # Slowest acceptable answer, in seconds, measured from a GitHub runner (outside Brazil, so these
  # are availability thresholds, not the LCP target). A check passes when one of three attempts
  # answers 200 within its limit: a single slow request is not an alert.
  SLOW_HEALTH: "3"
  SLOW_PAGE: "6"

jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Shared by the steps below: up to three requests, ten seconds apart; passes on the first that
      # answers 200 inside the limit and contains the expected text (when one is given). The log has
      # the status and the time of every attempt, which is the latency history this project has.
      - name: Prepare the probe
        run: |
          cat > "$RUNNER_TEMP/probe.sh" <<'EOF'
          #!/usr/bin/env bash
          # probe.sh <url> <max seconds> [text the body must contain]
          set -u
          url="$1"; limit="$2"; expect="${3:-}"
          for attempt in 1 2 3; do
            result=$(curl --silent --show-error --max-time 30 --output "$RUNNER_TEMP/body" --write-out "%{http_code} %{time_total}" "$url" || true)
            code="${result%% *}"; seconds="${result##* }"
            echo "attempt $attempt: HTTP ${code:-none} in ${seconds:-?}s (limit ${limit}s)"
            if [ "$code" = "200" ] && awk -v t="$seconds" -v l="$limit" 'BEGIN { exit !(t <= l) }'; then
              if [ -z "$expect" ] || grep -q "$expect" "$RUNNER_TEMP/body"; then exit 0; fi
              echo "the answer does not contain the expected text"
            fi
            [ "$attempt" = "3" ] || sleep 10
          done
          echo "::error::$url did not answer 200 within ${limit}s in three attempts. Open docs/runbooks/MONITORING.md."
          exit 1
          EOF
          chmod +x "$RUNNER_TEMP/probe.sh"

      - name: The application answers
        run: |
          "$RUNNER_TEMP/probe.sh" "$BASE_URL/api/health" "$SLOW_HEALTH" '"status":"ok"'

      - name: The home page renders
        run: |
          "$RUNNER_TEMP/probe.sh" "$BASE_URL/" "$SLOW_PAGE" "Linkfav"

      # The status page reads the database on the server: it fails here when the database does not
      # answer, even while cached public pages still open.
      - name: The status page reports no instability
        run: |
          "$RUNNER_TEMP/probe.sh" "$BASE_URL/status" "$SLOW_PAGE" "Tudo funcionando"

      # Optional: set the repository variable MONITOR_PUBLIC_PAGE to the path of a published page
      # kept for this purpose (for example /teste) to exercise the public renderer and the database.
      - name: A published page renders
        if: ${{ vars.MONITOR_PUBLIC_PAGE != '' }}
        env:
          PAGE: ${{ vars.MONITOR_PUBLIC_PAGE }}
        run: |
          case "$PAGE" in /[a-z0-9]*) ;; *) echo "::error::MONITOR_PUBLIC_PAGE must look like /endereco"; exit 1 ;; esac
          "$RUNNER_TEMP/probe.sh" "$BASE_URL$PAGE" "$SLOW_PAGE"

      - name: Jobs, billing and queues
        env:
          OPS_STATUS_SECRET: ${{ secrets.OPS_STATUS_SECRET }}
          ATTENTION: ${{ github.event.schedule == '43 12 * * *' || inputs.attention == true }}
        run: |
          if [ -z "$OPS_STATUS_SECRET" ]; then
            echo "::warning::OPS_STATUS_SECRET is not set in this repository: jobs, billing and queues are not being monitored (docs/runbooks/MONITORING.md)."
            exit 0
          fi
          query=""
          if [ "$ATTENTION" = "true" ]; then query="?attention=1"; fi
          status=$(curl --silent --show-error --max-time 30 --retry 2 --retry-delay 10 --output status.json --write-out "%{http_code}" \
            --header "Authorization: Bearer $OPS_STATUS_SECRET" "$BASE_URL/api/ops/status$query")
          # The body has counts and reason codes only (no personal data, no secret), so it is safe in a public log.
          cat status.json; echo
          if [ "$status" != "200" ]; then
            echo "::error::Operational status failed with HTTP $status. Open docs/runbooks/MONITORING.md."
            exit 1
          fi
