<!-- Email change template. Uses the token_hash flow handled by /auth/confirm. -->
<h2>Confirme a troca de e-mail</h2>
<p>Recebemos um pedido para trocar o e-mail da sua conta no Projeto LNK para {{ .NewEmail }}.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=email_change&amp;next=/app">Confirmar troca de e-mail</a></p>
<p>O link expira em 1 hora. Se você não fez este pedido, ignore esta mensagem e altere sua senha.</p>
