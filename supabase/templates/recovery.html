<!-- Password recovery template. Uses the token_hash flow handled by /auth/confirm. -->
<h2>Redefina sua senha</h2>
<p>Recebemos um pedido para redefinir a senha da sua conta no Projeto LNK.</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&amp;type=recovery&amp;next=/redefinir-senha">Criar uma nova senha</a></p>
<p>O link expira em 1 hora e só pode ser usado uma vez. Se você não fez este pedido, ignore esta mensagem; sua senha continua a mesma.</p>
